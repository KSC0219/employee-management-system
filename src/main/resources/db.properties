# Default: in-memory H2 database in MySQL mode, so the app runs with zero setup.
# To use MySQL, set environment variables instead (they override this file):
#   DB_URL=jdbc:mysql://localhost:3306/ems_db
#   DB_USER=root
#   DB_PASSWORD=your_password
db.url=jdbc:h2:mem:ems_db;MODE=MySQL;DB_CLOSE_DELAY=-1
db.user=sa
db.password=
